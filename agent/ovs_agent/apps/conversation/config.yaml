# Minimal full-duplex voice conversation app.
slv_url: "${OVS_SLV_URL:-ws://127.0.0.1:8621/v2v/stream}"

slv_config:
  # DEVICE DEPLOYMENTS: pin the operator's language here (e.g. via the
  # ${ASR_LANGUAGE:-...} env pattern used in
  # deploy/conversation/agent-config.yaml). Leaving this `auto` puts a
  # Chinese deployment on per-utterance language ID — this value becomes the
  # v2v session's asr_language and is the ONLY language knob the RK and
  # Jetson Qwen3-ASR backends have. The solution pins `zh` for that reason.
  asr_language: auto
  tts_language: zh
  tts_speaker_id: null
  tts_speed: 1.0
  sample_rate: 16000
  vad: none
  multi_utterance: true

client_vad_backend: silero
client_vad_threshold: null
# The client-VAD block below already matches the solution's shipped
# agent-config.yaml values (speech_min 200 ms, silence 600 ms, drive_eos
# true); a device deployment does NOT need to override these. 600 ms must
# stay below the backend endpoint threshold (1500 ms in the RK image's
# profile) so the client wins end-of-speech.
client_vad_speech_min_ms: 200
client_vad_silence_ms: 600
client_vad_drive_eos: true

barge_in_enabled: true
barge_in_min_chars: 2
barge_in_min_speaking_ms: 500
playback_drain_enabled: true
playback_drain_timeout_s: 15.0

llm_backend: "${LLM_BACKEND:-openai_compat}"
llm_base_url: "${LLM_BASE_URL:-http://127.0.0.1:8000/v1}"
llm_api_key: "${LLM_API_KEY:-EMPTY}"
llm_model: "${LLM_MODEL:-qwen3.5-flash}"
llm_enable_thinking: false

system_prompt: "${SYSTEM_PROMPT:-You are a natural, witty voice assistant. Reply in the user's language. Keep responses conversational and brief—usually one or two sentences. Add light humor when appropriate, but avoid rambling, repetition, Markdown, headings, and lists.}"

audio_input_device: auto
audio_output_device: auto
mic_channels: auto
mic_channel_select: auto
audio_input_sample_rate: 16000
audio_output_sample_rate: 24000

pipeline_mode: "${PIPELINE_MODE:-always_on}"
# ``runtime_kws`` is registered by ConversationApp only when wake-word mode is
# selected.  Keeping always_on as the OVS library default preserves existing
# deployments; products can opt in with PIPELINE_MODE=wake_word.
wake_sources: []
wake_mic_skip_ms: "${WAKEWORD_MIC_SKIP_MS:-120}"
wake_phrases:
  - "${WAKEWORD_PHRASE:-你好小智}"
default_mode: chat
realtime_protocol_version: 1
log_level: INFO

metadata:
  dashboard_port: 18000
  wake_tone:
    hz: 880
    ms: 130
    mic_suppress_tail_ms: 120
  wakeword:
    # Repo default `disabled` keeps the library default for existing
    # deployments. DEVICE DEPLOYMENTS override to `sherpa_onnx` via
    # WAKEWORD_BACKEND (both conversation composes default it to
    # sherpa_onnx); the KWS model assets are bundled in the agent image at
    # the WAKEWORD_MODEL_DIR paths below.
    backend: "${WAKEWORD_BACKEND:-disabled}"
    state_path: "${WAKEWORD_STATE_PATH:-/var/lib/ovs-agent/wakeword.json}"
    phrases:
      - "${WAKEWORD_PHRASE:-你好小智}"
    model:
      tokens: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/tokens.txt"
      encoder: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/encoder-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
      decoder: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/decoder-epoch-13-avg-2-chunk-8-left-64.onnx"
      joiner: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/joiner-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
      keywords_threshold: "${WAKEWORD_THRESHOLD:-0.25}"
      keywords_score: "${WAKEWORD_SCORE:-1.0}"
      num_trailing_blanks: 1
      num_threads: 1
    compiler:
      tokens: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/tokens.txt"
      lexicon: "${WAKEWORD_MODEL_DIR:-/opt/ovs/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20}/en.phone"
      tokens_type: phone+ppinyin
      timeout_s: 10
    cooldown_s: "${WAKEWORD_COOLDOWN_S:-2.0}"
