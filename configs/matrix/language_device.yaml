# (language, device) -> OpenVoiceStream profile matrix
#
# Consumed by tools/resolve_profile.py. One (language, device) pair resolves to
# exactly one existing profile in configs/profiles/ plus a small env overlay.
# Nothing here selects a profile that does not exist on disk; the resolver's
# test suite asserts that.
#
# status values
#   measured    - the exact ASR+TTS combination named by ovs_profile has an
#                 on-device number in evidence[].
#   untested    - every component has a number, the combination as a whole does
#                 not. Deployable, resolver prints WARN.
#   unsupported - no profile provides this pair. The resolver refuses. Chinese
#                 never silently falls back to Whisper (Whisper's own Chinese
#                 ceiling is 35-56% CER on every board measured,
#                 BENCHMARKS.md:20).
#
# Deviation from docs/specs/p-voice-split-multilingual-spec.md section 3 that is
# deliberate and must be re-read when the targeted bench lands: that table names
# Whisper + Kokoro for the "English and other" column on Orin NX / RK3576 /
# RK3588. No profile in configs/profiles/ pairs a Whisper ASR backend with any
# TTS backend - every Whisper profile there is ASR-only (orin-whisper.json,
# rk3576-whisper.json, rk3588-whisper.json, rpi5-hailo-whisper*.json all carry
# tts_backend: null). Building those pairings is part of the targeted bench, not
# of this matrix. Until then the non-Chinese lanes route to the existing
# combined profiles, and each cell records the Whisper/Kokoro pairing the spec
# wants under planned_alternative.

version: 1
schema: language_device_matrix/v1

# Language catalogue. The list is the RK runtime's 30-language set verbatim
# (qwen3asr_rk/python/qwen3asr/config.py:3-9). Qwen3-ASR upstream advertises 52
# languages; the RK runtime constant is the narrower of the two, so it is the
# one used here to keep a single language list across every device.
# Whisper's 99-language set is a superset of these 30, so no cell loses a
# language by adopting the narrower list.
language_catalog_source: qwen3asr_rk/python/qwen3asr/config.py:3-9
language_catalog_size: 30

languages:
  zh: {name: Chinese, name_zh: 中文, group: zh}
  en: {name: English, name_zh: 英语, group: en}
  yue: {name: Cantonese, name_zh: 粤语, group: other}
  ar: {name: Arabic, name_zh: 阿拉伯语, group: other}
  de: {name: German, name_zh: 德语, group: other}
  fr: {name: French, name_zh: 法语, group: other}
  es: {name: Spanish, name_zh: 西班牙语, group: other}
  pt: {name: Portuguese, name_zh: 葡萄牙语, group: other}
  id: {name: Indonesian, name_zh: 印尼语, group: other}
  it: {name: Italian, name_zh: 意大利语, group: other}
  ko: {name: Korean, name_zh: 韩语, group: other}
  ru: {name: Russian, name_zh: 俄语, group: other}
  th: {name: Thai, name_zh: 泰语, group: other}
  vi: {name: Vietnamese, name_zh: 越南语, group: other}
  ja: {name: Japanese, name_zh: 日语, group: other}
