    asr: {backend: rk.asr, model: Qwen3-ASR RKNN encoder + RKLLM decoder, quant: w8a8}
    tts: {backend: rk.tts, model: matcha-icefall-zh-en, quant: ORT acoustic + RKNN Vocos}
