  ms: {name: Malay, name_zh: 马来语, group: other}
  nl: {name: Dutch, name_zh: 荷兰语, group: other}
  sv: {name: Swedish, name_zh: 瑞典语, group: other}
  da: {name: Danish, name_zh: 丹麦语, group: other}
  fi: {name: Finnish, name_zh: 芬兰语, group: other}
  pl: {name: Polish, name_zh: 波兰语, group: other}
  cs: {name: Czech, name_zh: 捷克语, group: other}
  tl: {name: Filipino, name_zh: 菲律宾语, group: other}
  fa: {name: Persian, name_zh: 波斯语, group: other}
  el: {name: Greek, name_zh: 希腊语, group: other}
