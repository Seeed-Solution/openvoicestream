devices:
  orin_nano: {name: Jetson Orin Nano 8GB, name_zh: Jetson Orin Nano 8GB}
  orin_nx: {name: Jetson Orin NX 16GB, name_zh: Jetson Orin NX 16GB}
  # The fully-local Orin NX preset runs the TensorRT-Edge-LLM v0.9.1 image, a
  # different engine lineage from the cloud-LLM Orin NX preset. It gets its own
  # device id so a language switch stays inside that lineage.
  orin_nx_v091: {name: Jetson Orin NX 16GB (Edge-LLM v0.9.1 image), name_zh: Jetson Orin NX 16GB（Edge-LLM v0.9.1 镜像）}
  rk3576: {name: reComputer RK3576, name_zh: reComputer RK3576}
  rk3588: {name: reComputer RK3588, name_zh: reComputer RK3588}
  rpi5: {name: Raspberry Pi 5, name_zh: 树莓派 5}

# Applied to every resolved cell. Single session (spec section 3: 强制单会话).
# OVS_MAX_CONCURRENT_SESSIONS is read by server/core/session_limiter.py:108.
#
# The other half of that spec line — 单路 mono — is NOT an env variable here.
# It used to be emitted as OVS_AUDIO_INPUT_CHANNELS/OVS_AUDIO_MONO, which no
# code read, so it enforced nothing. The mono lane is enforced where the audio
# is: the agent opens the array and forwards exactly one channel
# (`mic_channel_select`, agent/ovs_agent/audio/profiles.py) and the server
# downmixes anything still multi-channel (server/core/asr_segmenter.py:287-289).
common_env:
  OVS_MAX_CONCURRENT_SESSIONS: "1"

cells:
  # -------------------------------------------------------------- Orin Nano
  - device: orin_nano
    group: zh
    status: measured
    ovs_profile: jetson-qwen3asr-matcha
    asr: {backend: jetson.trt_edge_llm, model: Qwen3-ASR 0.6B, quant: int4}
    tts: {backend: jetson.matcha_trt, model: matcha-icefall-zh-en, quant: bf16/fp16 Vocos}
    env: {}
    evidence:
      - BENCHMARKS.md:63 - Qwen3-ASR 0.6B int4 streaming + offline CER 0 (measured on Orin NX; the same engine set ships for Orin Nano)
      - configs/profiles/jetson-qwen3asr-matcha.json:2 - the shipped Orin Nano Qwen3-ASR + Matcha profile
    planned_alternative: null

  - device: orin_nano
    group: en
    status: untested
    ovs_profile: jetson-qwen3asr-matcha
    asr: {backend: jetson.trt_edge_llm, model: Qwen3-ASR 0.6B, quant: int4}
    tts: {backend: jetson.matcha_trt, model: matcha-icefall-zh-en, quant: bf16/fp16 Vocos}
    env: {}
    evidence:
      - configs/profiles/jetson-qwen3asr-matcha.json:2 - Matcha model is icefall zh-en, so English output is in scope
      - "no English WER has been scored on this profile"
    planned_alternative:
      description: Whisper-base TensorRT bf16 ASR + Kokoro TRT TTS, per spec section 3
      asr_profile: orin-whisper
      tts_profile: jetson-kokoro-trt
      blocked_on: no combined profile exists (orin-whisper.json declares tts_backend null); needs the targeted bench
      evidence:
        - docs/perf/whisper-cross-device-20260827.md:48 - Orin Nano base/30s bare TensorRT bf16, en short 11.37% / en long 9.19%, TTFT 18 ms, RTF 0.008

  - device: orin_nano
    group: other
    status: untested
    ovs_profile: jetson-multilang-highperf
    asr: {backend: jetson.trt_edge_llm, model: Qwen3-ASR 0.6B, quant: int4}
    tts: {backend: jetson.trt_edge_llm, model: Qwen3-TTS CustomVoice, quant: int4}
    env: {}
    evidence:
      - BENCHMARKS.md:64 - Qwen3-TTS CustomVoice int4, 9-row language conditioning correct, RTF 0.61 (Orin NX, 2026-07-04)
      - configs/profiles/jetson-multilang-highperf.json:2 - the combined Qwen3 ASR + Qwen3 TTS profile
      - "no per-language WER/CER outside zh/en has been scored on this profile, and the RTF above is an Orin NX number, not an Orin Nano one"
    planned_alternative:
      description: Whisper-base TensorRT bf16 ASR + Kokoro TRT TTS, per spec section 3
      asr_profile: orin-whisper
      tts_profile: jetson-kokoro-trt
      blocked_on: no combined profile exists; needs the targeted bench
      evidence:
        - docs/perf/whisper-cross-device-20260827.md:48

