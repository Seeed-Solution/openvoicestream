services:
  speech-kokoro-long32-canary:
    image: ${KOKORO_LONG32_VOICE_IMAGE:?set KOKORO_LONG32_VOICE_IMAGE to the reviewed candidate image}
    container_name: ${KOKORO_CANARY_CONTAINER:-openvoicestream-kokoro-long32-canary}
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8622"]
    volumes:
      - /dev:/dev
      - ../configs:/opt/speech/configs:ro
      - ${KOKORO_HYBRID_HOST_MODEL_DIR:?set the reviewed legacy fallback directory}:/opt/kokoro-hybrid:ro
      - ${KOKORO_LONG32_HOST_MODEL_DIR:?set the reviewed target-specific generator directory}:/opt/kokoro-long32:ro
      - ${KOKORO_LONG32_FRONTEND_HOST_DIR:?set the reviewed Kokoro 1.0 frontend directory}:/opt/kokoro-long32-frontend:ro
    environment:
      - OVS_PROFILE=${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET to rk3576 or rk3588}-kokoro-long32-canary
      - OVS_PROFILE_DEFAULT=${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET to rk3576 or rk3588}-kokoro-long32-canary
      - RK_ENSURE_MATCHA_RESOURCES=0
      - ASR_BACKEND=disabled
      - TTS_BACKEND=kokoro_rknn
      - TTS_MODEL_DIR=/opt/kokoro-hybrid
      - MODEL_DIR=/opt/kokoro-hybrid
      - KOKORO_MODEL_DIR=/opt/kokoro-hybrid
      - KOKORO_LONG32_ROOT=/opt/kokoro-long32/${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET}
      - KOKORO_LONG32_FRONTEND_ROOT=/opt/kokoro-long32-frontend
      - KOKORO_LONG32_PLATFORM=${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET}
      - KOKORO_RKNN_PLATFORM=${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET}
      # Empty by default: profile owns the reviewed two-bucket route; an
      # operator may explicitly supply a strict comma-separated override.
      - KOKORO_LONG32_ROUTE_TS=${KOKORO_LONG32_ROUTE_TS:-}
      - KOKORO_RKNN_MODE=long32
      - KOKORO_LONG32_MAX_SNAP_RATIO=${KOKORO_LONG32_MAX_SNAP_RATIO:-0.10}
      - KOKORO_LONG32_MAX_GENERATOR_RTF=${KOKORO_LONG32_MAX_GENERATOR_RTF:-0.30}
      - KOKORO_LONG32_ENFORCE_RTF=${KOKORO_LONG32_ENFORCE_RTF:-0}
      - KOKORO_LONG32_FALLBACK=${KOKORO_LONG32_FALLBACK:-hybrid}
      - KOKORO_PREFIX_ONNX=${KOKORO_PREFIX_ONNX:-kokoro-prefix-cpu.onnx}
      - KOKORO_FRONT_RKNN=${KOKORO_FRONT_RKNN:-${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET}/kokoro-decoder-front.int8.rknn}
      - KOKORO_TAIL_ONNX=${KOKORO_TAIL_ONNX:-kokoro-generator-tail-cpu.onnx}
      - KOKORO_RKNN_VOCODER_FRONT_PATH=${KOKORO_RKNN_VOCODER_FRONT_PATH:-${KOKORO_CANARY_TARGET:?set KOKORO_CANARY_TARGET}/kokoro-vocoder-front-half.native.fp16.rknn}
      - KOKORO_RKNN_TAIL_REST_PATH=${KOKORO_RKNN_TAIL_REST_PATH:-kokoro-vocoder-tail-rest-cpu.onnx}
      - KOKORO_SEQ_LEN=32
      - KOKORO_SAMPLE_RATE=24000
      - KOKORO_VOICE=${KOKORO_VOICE:-default}
      - KOKORO_PREFIX_ORT_INTRA_OP=1
      - KOKORO_PREFIX_ORT_INTER_OP=1
      - KOKORO_TAIL_ORT_INTRA_OP=4
      - KOKORO_TAIL_ORT_INTER_OP=1
      - KOKORO_ORT_GRAPH_OPT=all
      - KOKORO_ORT_ENABLE_MEM_PATTERN=0
      - RK_ARTIFACT_AUTO_DOWNLOAD=0
      - OVS_V2V_SERVER_LOOP=0
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8622/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
