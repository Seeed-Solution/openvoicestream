# OpenVoiceStream — Interruptible Conversational Voice AI on RK3588,
# with a local Qwen3-4B LLM on an RK1828 PCIe NPU card.
#
#   docker compose -f deploy/docker-compose.conversation-rk3588-rk1828.yml up -d
#
# Four services:
#   profile-init — resolves (LANGUAGE, device) -> one OVS profile before start
#   speech       — Qwen3-ASR + matcha TTS on the RK3588 NPU, V2V server on :8621
#   llm          — Qwen3-4B on the RK1828 card, OpenAI-compatible on :1828
#   agent        — mic/speaker client running `ovs-agent run conversation`
#
# ── IMAGE DEFAULTS ────────────────────────────────────────────────────────
#   speech: sensecraft-missionpack.seeed.cn/solution/openvoicestream:rk-20260921-bargein
#     Thin overlay on rk-20260921-twosentence: server/main.py + server/core/v2v.py
#     from main @ c6259e0 (PR #110). A barge-in `abort` with keep_asr cancels TTS
#     only and keeps the utterance the user interrupts with.
#     index sha256:66c1609280eca64c2e9559f61f047e8d7f593c80d9e136787ac048cdb05fda33
#     Its base, rk-20260921-twosentence:
#     Thin overlay on rk-20260920-piper-en.2: ASR_FINAL_STOP_ON_PUNCT=0 in the RK
#     profiles, their artifact sets and the profile contract (main @ 967d120). The
#     final decode no longer stops at the first sentence terminator, so "They ship
#     today. Do you want one?" reaches the LLM whole instead of as its first
#     sentence. Under it, rk-20260920-piper-en.2 carries the long-utterance ASR fix
#     and the Piper pauses (rkvoice-stream main @ 5978d04).
#     index sha256:f05c121d6bb7128e78c47739d5300d6c12b28308c49136e0a58bf6ed1506a81d
#     Lineage: rk-20260913.3 -> rk-20260919-envownership (profile_loader.py, operator
#     env ownership derived from the shipped profiles/leaves) -> rk-20260920-piper-en
#     (Piper profiles + manifest + piper.py) -> rk-20260920-piper-en.2 -> this.
#     See deploy/IMAGE-TAGS.md.
#     rk-20260913.3 itself:
#     sha256:d1677071dff68d0be3a3edd26d5959b4598a502ad05162901e509a706723794a
#     (linux/arm64, per `docker manifest inspect` recorded in the solution on
#     2026-09-13; not re-verified here). Carries the RK profile fix that raised
#     VAD_ENDPOINT_SILENCE_MS 400 -> 1500 so a mid-sentence pause no longer
#     splits one utterance into two turns.
#   agent:  sensecraft-missionpack.seeed.cn/solution/ovs-agent:voiceagent-20260921-bargein.3
#     Thin overlay on voiceagent-20260914-runtimekws: four agent files from main
#     @ 03bc82a (PRs #110, #111, #113) — barge-in keep_asr, stop-word tail, a new turn
#     cuts a reply still playing, LLM probe via GET /health (the chat probe
#     evicted the RK1828 prompt cache: TTFT 2.0-2.6 s -> 0.14-0.30 s).
#     index sha256:44edad9f9e80de12a71848a419a85274e6afeb28748954d08d295e104d879352
#     Its base, voiceagent-20260914-runtimekws:
#     sha256:a2dc17a304d7941e924d95de0863b53fd3e1869b7caba6ecf64a60e57cfd9569
#     (linux/arm64, recorded in the solution on 2026-09-13). Accumulates
#     mid-utterance asr_final segments; bundles the sherpa-onnx KWS assets.
#   Both overridable via SPEECH_IMAGE / AGENT_IMAGE (and LLM_IMAGE).
#
# ── SINGLE SESSION / LOOPBACK RATIONALE ──────────────────────────────────
# The speech service admits ONE /v2v/stream session and the agent holds it
# permanently. Speech and LLM therefore bind 127.0.0.1 by default: a LAN
# client connecting first would make the agent's reconnect fail with
# WS 4429 too_many_sessions and silence the assistant. Re-expose deliberately
# with OVS_SPEECH_BIND=0.0.0.0 / RK1828_HOST=0.0.0.0 only if you accept that.
#
# ── PROVENANCE ────────────────────────────────────────────────────────────
# Ported 2026-09-14 from sensecraft-solutions/solutions/conversational_voice_ai
# (assets/docker/docker-compose.rk3588.yml + docker-compose.rk3588-rk1828.yml,
# merged into one self-contained file — the solution used `extends` across the
# two). The resolver, matrix, and agent/audio config are the byte-identical
# copies at tools/resolve_profile.py, configs/matrix/language_device.yaml, and
# deploy/conversation/*.yaml in THIS repo; no solution checkout is needed.

services:
  # Resolves the operator's LANGUAGE choice plus this board's device id into
  # exactly one OpenVoiceStream profile before anything else starts.
  #
  # Exit 2 (unsupported pair, e.g. Chinese on a board without a zh cell) stops
  # the whole `docker compose up` before a service starts (depends_on:
  # service_completed_successfully), so an unsupported language fails visibly
  # instead of being transcribed by a model that cannot read it.
  # --no-verify-profile: configs/profiles/ lives inside the speech image at a
  # path this compose does not pin; the repo test suite is what guarantees
  # every profile the matrix names exists.
  profile-init:
    image: ${SPEECH_IMAGE:-sensecraft-missionpack.seeed.cn/solution/openvoicestream:rk-20260921-bargein}
    container_name: conversational-voice-profile-init
    init: true
    network_mode: none
    entrypoint:
      - python3
      - /opt/voice/config/resolve_profile.py
      - --matrix=/opt/voice/config/language_device.yaml
      - --language=${LANGUAGE:-zh}
      - --device=rk3588
      - --no-verify-profile
      - --write-env=/opt/voice/resolved/ovs.env
    volumes:
      - ../tools/resolve_profile.py:/opt/voice/config/resolve_profile.py:ro
      - ../configs/matrix/language_device.yaml:/opt/voice/config/language_device.yaml:ro
      - resolved-profile:/opt/voice/resolved
    restart: "no"

  speech:
    image: ${SPEECH_IMAGE:-sensecraft-missionpack.seeed.cn/solution/openvoicestream:rk-20260921-bargein}
    container_name: conversational-voice-speech
    privileged: true
    init: true
    network_mode: host
    command:
      - /bin/sh
      - -c
      # Internal service: the on-device agent is its only client (loopback).
      # Keep it on 127.0.0.1 — the session limiter allows ONE /v2v session, so
      # a LAN client connecting first makes the agent's reconnect fail with
      # 4429 too_many_sessions and silences the assistant. Re-expose
      # deliberately with OVS_SPEECH_BIND=0.0.0.0 (e.g. for a browser client).
      - 'set -a; . /opt/voice/resolved/ovs.env; set +a; exec python3 -m uvicorn server.main:app --host ${OVS_SPEECH_BIND:-127.0.0.1} --port 8621'
    depends_on:
      profile-init:
        condition: service_completed_successfully
    mem_limit: 12g
    memswap_limit: 12g
    volumes:
      - resolved-profile:/opt/voice/resolved:ro
      - /dev:/dev
      - rk-asr-models:/opt/asr/models
      - rk-tts-models:/opt/tts/models
      - voice-data:/opt/seeed-local-voice/data
    environment:
      # Profile-owned ASR/TTS variables are deliberately absent here: the
      # resolved OVS_PROFILE supplies them, so a language switch that changes
      # profile is not silently overridden by a value pinned in compose.
      OVS_PROFILE: ${OVS_PROFILE:-rk3588-default}
      OVS_PROFILE_DEFAULT: rk3588-default
      # Not read by the server -- the profile arrives through the resolved
      # ovs.env that profile-init writes. It is declared here so that changing
      # the language from device management changes THIS service's config too,
      # which makes compose recreate it. Without it the container is only
      # restarted as a side effect of its dependency being recreated (verified:
      # restart does re-source ovs.env, so it works today), and that leaves the
      # reconfigure path depending on compose's dependent-restart semantics
      # rather than on something this file states outright.
      LANGUAGE: ${LANGUAGE:-zh}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # Operator/deploy-time override for the ASR backend's own endpoint
      # threshold (ms). 0 / unset = keep the profile value (1500 ms in
      # rk3588-default). Deliberately NOT VAD_ENDPOINT_SILENCE_MS: that key
      # belongs to the baked profile and the profile loader re-stamps it at
      # startup, so an env entry for it never reaches the backend. Consumed per
      # session via the ASR stream options. Must stay above the client VAD
      # silence (shipped agent: 600 ms) or the backend wins the race and cuts
      # utterances in half — see docs/CONFIGURATION.md.
      OVS_V2V_VAD_ENDPOINT_SILENCE_MS: ${OVS_V2V_VAD_ENDPOINT_SILENCE_MS:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8621/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # Qwen3-4B on the RK1828 PCIe NPU card. Verbatim from the solution's
  # docker-compose.rk3588-rk1828.yml: 8k context, core mask ff, artifact
  # auto-download on first start into the rk1828-llm-models volume.
  # Host prerequisites (driver/firmware live on the host, NOT in the image):
  # see deploy/docker-compose.rk3588-ha.yml lines 13-20 — lspci shows the
  # 182a device, rknn3.service is active, /dev/pcie-rkep-* exists.
  llm:
    # 20260919-hostruntime.2: thin overlay on 20260731-kvreuse (staged RKNN3 worker
    # binary + libs byte-identical). Adds the host-runtime alignment below and
    # the configurable READY timeout. See deploy/IMAGE-TAGS.md for the digests.
    image: ${LLM_IMAGE:-sensecraft-missionpack.seeed.cn/solution/edge-llm-rk1828:20260919-hostruntime.2}
    container_name: conversational-voice-llm
    privileged: true
    init: true
    network_mode: host
    volumes:
      - /dev:/dev
      - rk1828-llm-models:/opt/llm/models
      # The image's RKNN3 client lib must be the same generation as the host's
      # rknn3_transfer_proxy and EP firmware — they ship in one host package and
      # only speak to each other. A skew makes model init block in read() with
      # no error until the READY timeout (2026-09-17: image 1.0.4 vs host 1.1.0,
      # every attempt dying at exactly 179.6 s). The entrypoint copies the host's
      # librknn3_api{,_rkcp}.so over the bundled pair when this is mounted, so
      # the client tracks whatever the host has installed. The whole dir is
      # mounted, not the two files: a bind mount of a file that does not exist on
      # the host makes docker CREATE A DIRECTORY at that host path.
      - /usr/lib:/opt/rk1828/host-lib:ro
    environment:
      RK1828_ARTIFACT_AUTO_DOWNLOAD: "1"
      RK1828_ARTIFACT_REPO_ID: harvestsu/seeed-local-voice-rk-artifacts
      RK1828_ARTIFACT_PREFIX: rk1828/opt/llm/qwen3-4b
      # The Qwen3-4B export on the artifact repo is built with a 2048-token
      # KV cache; asking for more makes the runtime fall back to 2048 anyway
      # (log: "chosen kvcache_buffer_lens: 2048"). Keep this equal to the
      # export until an 8K export ships.
      RK1828_MAX_CONTEXT: ${RK1828_MAX_CONTEXT:-2048}
      RK1828_CORE_MASK: ff
      RK1828_PORT: "1828"
      # Seconds the supervisor waits for the worker's READY handshake, per
      # attempt. Model init pushes ~3.2 GB over PCIe; 180 s covers a cold read
      # at the ~44 MB/s an eMMC/SD rootfs gives. Raise it for slower storage.
      RK1828_READY_TIMEOUT: ${RK1828_READY_TIMEOUT:-180}
      # Failed loads degrade the EP from 8 cores to 4, so do not add attempts
      # hoping one sticks — a load that fails identically every time will not.
      RK1828_START_ATTEMPTS: ${RK1828_START_ATTEMPTS:-3}
      # Internal service: the agent calls it on 127.0.0.1. Loopback by default
      # so the local LLM is not an open OpenAI-compatible endpoint on the LAN.
      RK1828_HOST: ${RK1828_HOST:-127.0.0.1}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1828/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

  agent:
    # voiceagent-20260914-runtimekws: the agent ACCUMULATES mid-utterance
    # asr_final segments instead of overwriting the user text, so a backend
    # endpoint that fires on a mid-sentence pause no longer splits one spoken
    # sentence into two LLM turns. Bundles the sherpa-onnx KWS model.
    image: ${AGENT_IMAGE:-sensecraft-missionpack.seeed.cn/solution/ovs-agent:voiceagent-20260921-bargein.3}
    container_name: conversational-voice-agent
    init: true
    network_mode: host
    depends_on:
      speech:
        condition: service_healthy
      llm:
        condition: service_healthy
    command: ["ovs-agent", "run", "conversation", "--config", "/opt/voice/config/agent-config.yaml"]
    # Bind the ALSA directory instead of snapshotting individual device nodes.
    # Together with the wildcard cgroup rule this keeps USB audio hot-pluggable.
    device_cgroup_rules:
      - "c 116:* rwm"
    group_add: ["29"]
    volumes:
      - /dev/snd:/dev/snd
      - ./conversation/agent-config.yaml:/opt/voice/config/agent-config.yaml:ro
      - ./conversation/audio_profiles.yaml:/opt/voice/config/audio_profiles.yaml:ro
      - agent-state:/var/lib/ovs-agent
    environment:
      CONFIG_DIR: /opt/voice/config
      # Debug dashboard (agent plugin, unauthenticated — it can also trigger
      # control actions such as abort/send-text). Default 0.0.0.0 so a headless
      # device is reachable from the operator's browser; opt back to loopback
      # with OVS_DEBUG_DASHBOARD_BIND=127.0.0.1 on untrusted networks.
      OVS_DEBUG_DASHBOARD_BIND: ${OVS_DEBUG_DASHBOARD_BIND:-0.0.0.0}
      # The agent turns these into the per-session v2v config (asr_language/
      # tts_language), which is the only language knob the Qwen3-ASR and
      # Qwen3-TTS backends have. Same operator input as profile-init above.
      ASR_LANGUAGE: ${LANGUAGE:-zh}
      TTS_LANGUAGE: ${LANGUAGE:-zh}
      OVS_SLV_URL: ws://127.0.0.1:8621/v2v/stream
      OVS_AGENT_SERVER_LOOP: "0"
      PIPELINE_MODE: ${PIPELINE_MODE:-always_on}
      WAKEWORD_BACKEND: ${WAKEWORD_BACKEND:-sherpa_onnx}
      WAKEWORD_PHRASE: ${WAKEWORD_PHRASE:-你好小智}
      WAKEWORD_THRESHOLD: ${WAKEWORD_THRESHOLD:-0.25}
      WAKEWORD_MIC_SKIP_MS: ${WAKEWORD_MIC_SKIP_MS:-120}
      LLM_BACKEND: openai_compat
      LLM_BASE_URL: http://127.0.0.1:1828/v1
      LLM_API_KEY: EMPTY
      LLM_MODEL: Qwen3-4B
      # History trim budget for a 2048-token LLM context. Trim counts only
      # history (not the ~1150-token system prompt) and keeps it at
      # <= 0.75 x this value by the agent's estimate, which without the Qwen
      # tokenizer in the image is chars x 1.5 (over-counts: ~2x for Chinese,
      # more for English). 1000 keeps real history <= ~360 tokens for Chinese,
      # so prompt + a full 512-token reply fits in 2048. Known noise: the
      # startup check logs "FIXED PREFIX ... headroom" at ERROR for this value.
      OVS_AGENT_SESSION_MAX_INPUT_TOKENS: ${OVS_AGENT_SESSION_MAX_INPUT_TOKENS:-1000}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      DEFAULT_MODE: chat
    restart: unless-stopped

volumes:
  resolved-profile:
  rk-asr-models:
    name: rk-asr-models
  rk-tts-models:
    name: rk-tts-models
  voice-data:
    name: conversational-voice-data
  agent-state:
    name: conversational-voice-agent-state
  rk1828-llm-models:
    name: rk1828-llm-models
