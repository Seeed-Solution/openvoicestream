# OpenVoiceStream — Rockchip RK3588 (reComputer RK3588).
#
# Usage (repo root as cwd):
#   docker compose -f deploy/docker-compose.rk3588.yml up -d
#
# Same Docker image as deploy/docker-compose.rk.yml (RK3576);
# only the artifact set and runtime tuning differ between the two boards.
#
# Hardware: needs /dev (RKNN NPU char devs) and host networking. The image
# is built against Debian 12 slim; see deploy/docker/Dockerfile.rk.

services:
  speech:
    image: sensecraft-missionpack.seeed.cn/solution/seeed-local-voice:rk-qwen3asr-opt-20260610
    container_name: openvoicestream
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8621"]
    # 12g, not 7500m: the RK3588 board has 16 GB. The old cap was inherited from
    # the 8 GB RK3576 profile and sat right at the co-residency failure point
    # once the LLM turn was added (measured steady state: 2.8 GiB).
    mem_limit: 12g
    memswap_limit: 12g
    volumes:
      - /dev:/dev
      - ../configs:/opt/speech/configs:ro
      - rk-asr-models:/opt/asr/models
      - rk-tts-models:/opt/tts/models
      - seeed-local-voice-data:/opt/seeed-local-voice/data
    environment:
      - OVS_PROFILE=${OVS_PROFILE:-}
      # Week 2: structured JSON logs in production.
      - OVS_LOG_FORMAT=${OVS_LOG_FORMAT:-json}
      # Admin endpoints are loopback-only by default. Set OVS_ADMIN_KEY (in
      # .env or shell) and pass it back as the X-Admin-Key header to enable
      # remote admin. Unset keeps remote admin disabled (403).
      - OVS_ADMIN_KEY=${OVS_ADMIN_KEY:-}
      - OVS_PROFILE_DEFAULT=${OVS_PROFILE_DEFAULT:-rk3588-default}
      # Open-dialogue endpointing defaults. Override in .env for product tuning.
      - OVS_VAD_BACKEND=${OVS_VAD_BACKEND:-silero}
      - OVS_VAD_SILENCE_MS=${OVS_VAD_SILENCE_MS:-400}
      # ── ASR ─────────────────────────────────────────────────────────
      - ASR_BACKEND=qwen3_asr_rk
      - ASR_DECODER_TYPE=rkllm
      - ASR_DECODER_QUANT=w8a8
      - ASR_PLATFORM=rk3588
      - ASR_ENABLED_CPUS=4
      # NPU_CORE_1, never NPU_CORE_AUTO: matcha pins its Vocos RKNN context to
      # NPU_CORE_0 and reserves CORE_1 for this encoder (see matcha.py's
      # init_runtime(core_mask=1) comment). AUTO lets the runtime place the
      # unlocked ASR encoder on core 0 too, i.e. it silently discards the
      # designed core separation between the two co-resident RKNN contexts.
      - ASR_NPU_CORE_MASK=${ASR_NPU_CORE_MASK:-}
      - ASR_MAX_NEW_TOKENS=${ASR_MAX_NEW_TOKENS:-}
      - ASR_FINAL_STOP_ON_PUNCT=${ASR_FINAL_STOP_ON_PUNCT:-}
      - ASR_FINAL_STOP_MIN_CHARS=${ASR_FINAL_STOP_MIN_CHARS:-}
      - ASR_FINAL_STOP_MIN_CHUNKS=${ASR_FINAL_STOP_MIN_CHUNKS:-}
      - ASR_MODEL_DIR=/opt/asr/models
      - RKLLM_LIB_PATH=/opt/asr/lib/librkllmrt.so
      - RK_ARTIFACT_AUTO_DOWNLOAD=${RK_ARTIFACT_AUTO_DOWNLOAD:-1}
      - RK_ARTIFACT_REPO_ID=${RK_ARTIFACT_REPO_ID:-harvestsu/seeed-local-voice-rk-artifacts}
      - RK_ARTIFACT_MANIFEST=${RK_ARTIFACT_MANIFEST:-/opt/speech/deploy/artifacts/rk_manifest.json}
      - RK_ARTIFACT_SET=${RK_ARTIFACT_SET:-rk3588-multilang-2026-05-17}
      - RK_ARTIFACT_ROOT=${RK_ARTIFACT_ROOT:-/}
      - RK_ARTIFACT_REVISION=${RK_ARTIFACT_REVISION:-main}
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      # True streaming: 400 ms chunks + left-context encoder + silero VAD
      # endpoint pre-fire → near-zero stop→final latency. Required for the
      # multi_utterance V2V path (see docs/api/v2v-stream.md).
      - QWEN3_ASR_CHUNK_CONFIRM=${QWEN3_ASR_CHUNK_CONFIRM:-}
      - QWEN3_ASR_STREAM_MODE=${QWEN3_ASR_STREAM_MODE:-}
      - QWEN3_ASR_STREAM_TRUE=${QWEN3_ASR_STREAM_TRUE:-}
      - QWEN3_ASR_TRUE_ROLL_SEC=${QWEN3_ASR_TRUE_ROLL_SEC:-}
      - QWEN3_ASR_TRUE_PARTIAL_TOKENS=${QWEN3_ASR_TRUE_PARTIAL_TOKENS:-}
      - QWEN3_ASR_TRUE_PARTIAL_INTERVAL_MS=${QWEN3_ASR_TRUE_PARTIAL_INTERVAL_MS:-}
      - QWEN3_ASR_TRUE_PARTIAL_WARMUP=${QWEN3_ASR_TRUE_PARTIAL_WARMUP:-}
      - QWEN3_ASR_VAD_FINAL_ASYNC=${QWEN3_ASR_VAD_FINAL_ASYNC:-}
      - QWEN3_ASR_FRONTEND_EOU_MIN_AUDIO_S=${QWEN3_ASR_FRONTEND_EOU_MIN_AUDIO_S:-}
      # 400 ms (the rk3588-default profile value). At 800 ms the endpoint
      # debounce alone was the single largest term in the mouth-to-ear budget.
      - VAD_ENDPOINT_SILENCE_MS=${VAD_ENDPOINT_SILENCE_MS:-}
      # ── TTS ─────────────────────────────────────────────────────────
      - TTS_BACKEND=matcha_rknn
      - TTS_MODEL_DIR=/opt/tts/models
      - SHERPA_TTS_MODEL_DIR=/opt/tts/models/matcha-icefall-zh-en
      - TTS_PROVIDER=cpu
      - TTS_NUM_THREADS=4
      - TTS_DEFAULT_SID=0
      - OVS_TTS_SPEAKERS_FILE=/opt/seeed-local-voice/data/speakers.json
      - SPARKTTS_VOICES_DIR=/opt/seeed-local-voice/data/sparktts_voices
      - MATCHA_MAX_PHONEMES=64
      - MATCHA_MODEL_SEQ_LEN=${MATCHA_MODEL_SEQ_LEN:-}
      - MATCHA_USE_ORT=${MATCHA_USE_ORT:-}
      - MATCHA_MODEL=matcha-s64.rknn
      - VOCOS_MODEL=vocos-16khz-600.rknn
      - VOCOS_FRAMES=256
      - MATCHA_ONNX_PATH=/opt/tts/models/model-steps-3.onnx
      # ── V2V server loop + local LLM on the RK1828 card ──────────────
      # OVS_V2V_ENGINE and OVS_V2V_SERVER_LOOP are load-bearing as a PAIR:
      # with either one missing the service is an ASR->TTS pass-through and
      # never calls an LLM. EDGE_LLM_BASE_URL must be set explicitly — the code
      # default (127.0.0.1:8000) points at nothing here and fails silently.
      #
      # The endpoint is rk1828-llm.service: Qwen3-4B on the RK1828 PCIe NPU
      # card, OpenAI-compatible, loopback-only (reachable because this container
      # uses host networking). Measured TTFT 130 ms, 81.5 tok/s.
      # NOTE the card has ONE 5 GB context: rk1828-llm and tts-rk3588 (Qwen3-TTS)
      # cannot both be resident, so tts-rk3588 stays stopped while this runs.
      - OVS_V2V_ENGINE=voxedge
      - OVS_V2V_SERVER_LOOP=1
      - EDGE_LLM_BASE_URL=http://127.0.0.1:1828/v1
      - EDGE_LLM_MODEL=Qwen3-4B
      # Without a system prompt the model answers a spoken turn like a chat
      # assistant: ~330 chars of Markdown, which synthesized to 87 SECONDS of
      # audio for one short question and produced 72 markup-only fragments that
      # the TTS backend could only answer with 0.1 s of silence each.
      - "OVS_V2V_SYSTEM_PROMPT=你是语音助手。用一到两句口语化中文回答，直接回答不要解释。禁止使用 Markdown、标题、列表或任何符号排版。"
      - "OVS_V2V_LLM_MAX_TOKENS=96"
      # ── Misc ────────────────────────────────────────────────────────
      - MODEL_DIR=/opt/tts/models
    restart: unless-stopped
    # Week 1 hardening: rely on /readyz; /health is deprecated.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8621/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  rk-asr-models:
    name: rk-asr-models
  rk-tts-models:
    name: rk-tts-models
  seeed-local-voice-data:
    name: seeed-local-voice-data
